<!doctype html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Badläget har flyttat</title>
<!-- Beta-versionen är nu den riktiga appen — skicka vidare dit -->
<meta http-equiv="refresh" content="0; url=../">
<script>
  if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then((regs) => regs.forEach((r) => { if (r.scope.endsWith("/beta/")) r.unregister(); }));
  location.replace("../");
</script>
</head>
<body><p><a href="../">Till Badläget</a></p></body>
</html>
